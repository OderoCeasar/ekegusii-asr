name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest jiwer

      - name: Run normalizer tests
        run: pytest src/prep/

      - name: Run evaluation tests
        run: pytest src/eval/

      - name: Validate manifests
        run: |
          if find data/manifests -maxdepth 1 -type f \
            \( -name "train.jsonl" -o -name "dev.jsonl" -o -name "test.jsonl" -o -name "test-hard.jsonl" \) \
            | grep -q .; then
            python scripts/validate_manifests.py data/manifests/
          else
            echo "No manifest files found; skipping manifest validation."
          fi
