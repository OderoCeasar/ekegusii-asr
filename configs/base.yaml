# Baseline fine-tuning config. Copy, edit, commit -- one file per run.
# Log the run in reports/experiments.md. A run not in that table did not happen.

run_id: xlsr300m-baseline-v1
data_version: v0.1

model:
  name: facebook/wav2vec2-xls-r-300m
  freeze_feature_encoder: true
  attention_dropout: 0.05
  hidden_dropout: 0.05
  feat_proj_dropout: 0.05
  mask_time_prob: 0.05       # raise to 0.08 if overfitting
  layerdrop: 0.05
  ctc_loss_reduction: mean

data:
  train_manifest: data/manifests/train.jsonl
  dev_manifest:   data/manifests/dev.jsonl
  sample_rate: 16000
  min_duration: 3.0
  max_duration: 15.0
  augment:
    speed_perturb: [0.9, 1.0, 1.1]   # train only, never dev/test
    noise_snr_db: [5, 10, 20]

train:
  learning_rate: 3.0e-4      # drop to 1e-4 if loss is unstable
  warmup_steps: 500
  num_train_epochs: 30
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2
  fp16: true
  gradient_checkpointing: true
  group_by_length: true
  eval_strategy: steps
  eval_steps: 400
  save_steps: 400            # small enough to lose <20 min when the session dies
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: wer
  greater_is_better: false
  push_to_hub: true          # session disks vanish; the Hub does not
  hub_model_id: ORG/ekegusii-xlsr-300m

decode:
  mode: greedy               # greedy | beam_lm
  lm_path: null              # models/ekegusii_5gram.arpa
  alpha: 0.5                 # tune on DEV only
  beta: 1.5
  beam_width: 100
